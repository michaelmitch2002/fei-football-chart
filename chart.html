    &lt;p data-measure-description=&quot;schedule&quot;&gt;&lt;strong&gt;Strength of schedule:&lt;/strong&gt; &lt;code&gt;SOS = E[losses]&lt;/code&gt;. How many losses the selected benchmark team would expect against this team’s schedule to date. Higher means a tougher schedule, regardless of the team’s actual results.&lt;/p&gt;
    &lt;p data-measure-description=&quot;record&quot; hidden&gt;&lt;strong&gt;Strength of record:&lt;/strong&gt; &lt;code&gt;SOR = E[losses] − actual losses&lt;/code&gt; (equivalently, &lt;code&gt;actual wins − E[wins]&lt;/code&gt;). Actual wins minus the wins expected of the selected benchmark against the same schedule. Positive means more wins than expected; negative means fewer. Higher means a stronger record after accounting for schedule difficulty.&lt;/p&gt;
    &lt;p data-measure-description=&quot;fei&quot; hidden&gt;&lt;strong&gt;FEI rating:&lt;/strong&gt; opponent-adjusted efficiency, shown as standard deviations above or below the mean of all 138 FBS teams in the selected week. Raw ratings and published FEI ranks are included in the team details and rankings.&lt;/p&gt;
    &lt;p data-measure-description=&quot;combined&quot; hidden&gt;&lt;strong&gt;SOR + FEI:&lt;/strong&gt; &lt;code&gt;score = SOR weight × SOR_std + FEI weight × FEI_std&lt;/code&gt;. Each input is centered at its selected-week FBS mean and divided by its population standard deviation: &lt;code&gt;standardized value = (value − mean) / SD&lt;/code&gt;. Higher scores rank first. The weighted score is not standardized again; its spread depends on the weights and the relationship between the inputs. This is a custom ranking using published rating values; equal scores share a rank when head-to-head is off.&lt;/p&gt;

   const mean=values.reduce((sum,v)=&gt;sum+v,0)/values.length;

   return values.map(v=&gt;sd?(v-mean)/sd:0);
